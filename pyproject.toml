[project]
name = "chatbot-classroom-speech-analysis"
version = "0.1.0"
description = "Análisis de voz y chatbot para el aula utilizando Ollama y Python"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Maria Celdrán Noguera" }
]

#  Aquí están tus dependencias oficiales del proyecto
dependencies = [
    "pymupdf>=1.24.0",  # 'fitz' en código se instala formalmente como pymupdf
    "ollama>=0.4.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pipreqs>=0.4.13"   
]